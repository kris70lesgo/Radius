services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: radius_dev
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: radius_dev_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
