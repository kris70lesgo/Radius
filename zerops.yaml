# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yml-json-schema.json
# Radius — Zerops build & deploy configuration
# Monorepo: pnpm + Turborepo. Two runtime services (api + web) + managed Postgres + Valkey.

zerops:
  # ── API: Express + BullMQ worker + Prisma ───────────────────────────────
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @radius/shared build
          pnpm --filter @radius/api build
      # Deploy only what the runtime needs. node_modules is installed at runtime
      # via initCommands to avoid pnpm symlink issues during file copy.
      deployFiles:
        - apps/api/dist
        - apps/api/package.json
        - apps/web/package.json
        - packages/shared/dist
        - packages/shared/package.json
        - prisma
        - prisma.config.ts
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
      cache: node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3001
          path: /health
        failureTimeout: 180s
        retryPeriod: 10s
    run:
      base: nodejs@22
      prepareCommands:
        - corepack enable
        - corepack prepare pnpm@10.14.0 --activate
      initCommands:
        - pnpm install --frozen-lockfile
        - pnpm prisma generate
        # Clean up leftover Radius schema from prior failed diagnostic deployments.
        # Drops all app-owned tables and enum types but preserves the
        # Zerops-managed heartbeat table. Safe because the database has no
        # production data — only leftover objects from failed migration attempts.
        - |
          cat > /tmp/cleanup-radius.sql << 'SQLEOF'
          DO $$
          DECLARE r RECORD;
          BEGIN
            FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename != 'heartbeat')
            LOOP
              EXECUTE 'DROP TABLE IF EXISTS public."' || r.tablename || '" CASCADE';
            END LOOP;
            FOR r IN (SELECT typname FROM pg_type t JOIN pg_namespace n ON t.typnamespace = n.oid WHERE n.nspname = 'public' AND t.typtype = 'e')
            LOOP
              EXECUTE 'DROP TYPE IF EXISTS public."' || r.typname || '"';
            END LOOP;
          END $$;
          SQLEOF
          pnpm prisma db execute --file /tmp/cleanup-radius.sql
        - pnpm prisma migrate resolve --applied 20260303140315_baseline
        - pnpm prisma migrate deploy
      ports:
        - port: 3001
          httpSupport: true
      start: node apps/api/dist/index.js
      envVariables:
        NODE_ENV: production
        PORT: "3001"
        # Cross-service references: Zerops fills these from managed service env vars
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${redis_connectionString}

  # ── Web: Vite static build (React SPA) ──────────────────────────────────
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @radius/shared build
          pnpm --filter @radius/web build
      # The ~ wildcard flattens apps/web/dist/ contents into /var/www/
      deployFiles: apps/web/dist/~
      cache: node_modules
      envVariables:
        # UPDATE THIS after first deploy with the actual Zerops API subdomain URL.
        # Format is typically: https://<project>-api.zerops.app
        VITE_API_URL: "https://api.zerops.app"
    run:
      base: static
      ports:
        - port: 80
          httpSupport: true
      routing:
        cors: "'*' always"
