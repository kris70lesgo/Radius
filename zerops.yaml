# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yml-json-schema.json
# Radius — Zerops build & deploy configuration
# Monorepo: pnpm + Turborepo. Two runtime services (api + web) + managed Postgres + Valkey.

zerops:
  # ── API: Express + BullMQ worker + Prisma ───────────────────────────────
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @radius/shared build
          pnpm --filter @radius/api build
      # Deploy only what the runtime needs. node_modules is installed at runtime
      # via initCommands to avoid pnpm symlink issues during file copy.
      deployFiles:
        - apps/api/dist
        - apps/api/package.json
        - apps/web/package.json
        - packages/shared/dist
        - packages/shared/package.json
        - prisma
        - prisma.config.ts
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
      cache: node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3001
          path: /health
        failureTimeout: 180s
        retryPeriod: 10s
    run:
      base: nodejs@22
      prepareCommands:
        - corepack enable
        - corepack prepare pnpm@10.14.0 --activate
      initCommands:
        - pnpm install --frozen-lockfile
        - |
          cat > /tmp/init-db.js << 'JSEOF'
          const { Client } = require(require.resolve('pg', { paths: ['/var/www/apps/api/node_modules', '/var/www/node_modules', process.cwd() + '/apps/api/node_modules', process.cwd() + '/node_modules'] }));
          async function main() {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            const info = await client.query('SELECT current_user, session_user, current_database()');
            console.log('Connected as:', JSON.stringify(info.rows[0]));
            const schemaOwner = await client.query("SELECT n.nspname, pg_catalog.pg_get_userbyid(n.nspowner) AS owner FROM pg_namespace n WHERE n.nspname = 'public'");
            console.log('Schema owner:', JSON.stringify(schemaOwner.rows[0]));
            try { await client.query('GRANT CREATE ON SCHEMA public TO current_user'); console.log('GRANT succeeded'); } catch (e) { console.log('GRANT failed:', e.message); }
            try {
              await client.query(`CREATE TABLE IF NOT EXISTS "_prisma_migrations" (id VARCHAR(36) NOT NULL PRIMARY KEY, checksum VARCHAR(64) NOT NULL, finished_at TIMESTAMPTZ NOT NULL, migration_name VARCHAR(255) NOT NULL, logs TEXT, rolled_back_at TIMESTAMPTZ, started_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP, applied_steps_count INTEGER NOT NULL DEFAULT 0)`);
              console.log('CREATE TABLE succeeded');
              await client.query(`INSERT INTO "_prisma_migrations" (id, checksum, finished_at, migration_name, started_at, applied_steps_count) SELECT replace(gen_random_uuid()::text, '-', ''), '', NOW(), '20260303140315_baseline', NOW(), 0 WHERE NOT EXISTS (SELECT 1 FROM "_prisma_migrations" WHERE migration_name = '20260303140315_baseline')`);
              console.log('INSERT baseline succeeded');
            } catch (e) { console.log('CREATE TABLE failed:', e.message); }
            await client.end();
          }
          main().catch(e => { console.error(e); process.exit(1); });
          JSEOF
          node /tmp/init-db.js
        - pnpm prisma migrate deploy
      ports:
        - port: 3001
          httpSupport: true
      start: node apps/api/dist/index.js
      envVariables:
        NODE_ENV: production
        PORT: "3001"
        # Cross-service references: Zerops fills these from managed service env vars
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${redis_connectionString}

  # ── Web: Vite static build (React SPA) ──────────────────────────────────
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @radius/shared build
          pnpm --filter @radius/web build
      # The ~ wildcard flattens apps/web/dist/ contents into /var/www/
      deployFiles: apps/web/dist/~
      cache: node_modules
      envVariables:
        # UPDATE THIS after first deploy with the actual Zerops API subdomain URL.
        # Format is typically: https://<project>-api.zerops.app
        VITE_API_URL: "https://api.zerops.app"
    run:
      base: static
      ports:
        - port: 80
          httpSupport: true
      routing:
        cors: "'*' always"
